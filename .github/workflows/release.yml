name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Verify release tag matches package version
        run: |
          node -e "const version=require('./package.json').version;if(process.env.GITHUB_REF.startsWith('refs/tags/')&&process.env.GITHUB_REF_NAME!=='v'+version)throw new Error('Tag must match package.json version: v'+version)"
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Prepare release files and checksums
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/Agent-Pulse-Setup-*-x64.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer.' }
          $files = @($installers[0])
          $checksums = foreach ($file in $files) {
            "$((Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($file.Name)"
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'release/SHA256SUMS.txt'), ($checksums -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@v7
        with:
          name: windows-release
          if-no-files-found: error
          retention-days: 14
          path: |
            release/Agent-Pulse-Setup-*-x64.exe
            release/SHA256SUMS.txt

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: release
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Agent Pulse $GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == v0.* || "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${args[@]}"
